<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-title" content="Frame">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <title>Photos · Frame</title>
  <link rel="stylesheet" href="app.css">
</head>
<body data-title="Photos">
<!-- The header, tabs and name box are added by app.js. -->
<main>
<section>
  <p class="muted">Photos are shrunk on your phone before they're sent, then shown in black and white on the frame.</p>
  <label class="button primary wide upload-button" for="photo-input">Add photos</label>
  <input type="file" id="photo-input" accept="image/*" multiple hidden data-max-edge="1200" data-max-mb="25"
         data-fill-attr="data-max-edge:photo_max_edge_px,data-max-mb:max_upload_mb">
  <ul class="list" id="progress"></ul>
</section>
<section>
  <h2>On the frame</h2>
  <div class="thumbs" id="thumbs"></div>
  <p class="muted" id="photos-empty" hidden>No photos yet.</p>
</section>
</main>
<script src="app.js"></script>
<script src="photos.js"></script>
</body>
</html>
